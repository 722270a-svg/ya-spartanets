name: Import exact Spartans logo
on:
  push:
    branches: [main]
    paths: ['.github/workflows/import-exact-logo.yml']
permissions:
  contents: write
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download supplied original PNG
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/branding
          curl --fail --location --silent --show-error --max-time 60 'https://at.adobe.com/j7B5vUFVsBFigoXu' -o assets/branding/logo-entry.png
          python3 - <<'PY'
          import struct
          p='assets/branding/logo-entry.png'
          data=open(p,'rb').read()
          assert data[:8]==bytes.fromhex('89504e470d0a1a0a'), 'Download did not return a PNG'
          width,height=struct.unpack('>II',data[16:24])
          assert width>=400 and height>=400,(width,height)
          print('Imported exact source PNG',width,height)
          PY
      - name: Commit original logo to repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/branding/logo-entry.png
          git commit -m 'Import exact supplied Spartans PNG for all app logos'
          git push
