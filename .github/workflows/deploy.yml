name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Build static web demo
        run: npm run build:web
        env:
          CI: '1'
          EXPO_NO_DOTENV: '1'
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
      - run: python3 tests/check_web_build.py
      - name: Publish S Kem Pobuhat demo
        run: |
          mkdir -p dist/web/s-kem-pobuhat
          cp public-demos/s-kem-pobuhat/index.html dist/web/s-kem-pobuhat/index.html
      - name: Publish club branding images
        run: |
          mkdir -p dist/web/branding
          if [ -d assets/branding ]; then cp assets/branding/* dist/web/branding/; fi
      - name: Publish player portraits from uploaded ZIP
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import shutil
          archive = Path('Spartans_Photos_For_GitHub (1).zip')
          destination = Path('dist/web/player-photos')
          destination.mkdir(parents=True, exist_ok=True)
          count = 0
          with ZipFile(archive) as z:
              for member in z.infolist():
                  basename = Path(member.filename).name
                  if not member.is_dir() and basename.lower().endswith('.webp') and basename.startswith('photo_'):
                      target = destination / basename
                      if target.exists():
                          raise RuntimeError(f'Duplicate player photo: {basename}')
                      with z.open(member) as source, target.open('wb') as output:
                          shutil.copyfileobj(source, output)
                      count += 1
          if count < 40:
              raise RuntimeError(f'Expected 40 player photos; extracted only {count}')
          print(f'Published {count} player portraits to {destination}')
          PY
      - name: Publish verified source-table 2026 game statistics
        run: |
          python3 - <<'PY'
          import base64, zlib, json
          from pathlib import Path
          packed = Path('src/data/spartans-2026-stats.deflate.b64').read_text().strip()
          records = json.loads(zlib.decompress(base64.b64decode(packed)))
          assert len(records) == 10, f'Expected 10 match tabs, got {len(records)}'
          target = Path('dist/web/data/spartans-2026.json')
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(json.dumps(records, ensure_ascii=False), encoding='utf-8')
          print(f'Published {len(records)} match tables to {target}')
          PY
      - name: Keep Expo asset directories on Pages
        run: touch dist/web/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist/web

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
