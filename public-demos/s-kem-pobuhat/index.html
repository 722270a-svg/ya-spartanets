.discover{margin-bottom:23px}.discoverhead{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin-bottom:16px}
.overline{color:#b95161;font-size:10px;font-weight:850;letter-spacing:2.1px;margin-bottom:7px}
.discoverhead h2{margin:0;font-size:24px;font-weight:790;letter-spacing:-.75px}.discoverhead p{margin:6px 0 0;color:#868993;font-size:12.5px;line-height:1.5}
.discovercount{flex-shrink:0;background:#fff;border:1px solid #e6e7e8;border-radius:18px;padding:9px 12px;font-size:11px;font-weight:750;color:#656971}
.catgroups{display:flex;gap:7px;overflow:auto;padding:0 0 13px;scrollbar-width:thin}.groupchip{white-space:nowrap;font-size:12px;color:#737780;background:#fff;border:1px solid #e4e5e6;border-radius:9px;padding:9px 13px;font-weight:650}
.groupchip.active{background:#252930;color:#fff;border-color:#252930}.groupchip:hover:not(.active){border-color:#b95161;color:#b95161}
.categories{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:0}
.cat{padding:0;border:1px solid #28292e13;display:block;min-width:0;min-height:132px;height:132px;overflow:hidden;position:relative;text-align:left;border-radius:13px;background:#26282e;box-shadow:0 8px 18px rgba(32,34,40,.07);transition:transform .18s,border .18s}
.cat:hover{transform:translateY(-2px);box-shadow:0 12px 23px #12151d20}.cat.selected{background:#27282e;border:2px solid #db7583;box-shadow:0 0 0 3px #d054652f}
.catphoto{position:absolute;inset:0;background-size:cover;background-position:center;filter:saturate(.94) contrast(1.04);transition:transform .35s}
.cat:hover .catphoto{transform:scale(1.055)}.catlabel{position:absolute;inset:auto 13px 12px 13px;display:flex;flex-direction:column;gap:5px;z-index:1}
.cat .catname{font-size:16px;color:#fff;font-weight:800;text-align:left;text-shadow:0 2px 7px #0006;line-height:1.08}
.cat .catmeta{color:#f0edeacc;font-size:10px;font-weight:600;text-align:left}.cat .catmeta span{float:right;font-size:14px;color:#fff}
.cat-more-row{display:flex;justify-content:center;margin:15px 0 0}.morecats{border:1px solid #d8d9dc;background:transparent;color:#41474f;font-size:12px;font-weight:750;padding:10px 18px;border-radius:9px}.morecats:hover{background:#fff}
.sectionhead h3{font-weight:800;font-size:19px}.mapgrid{grid-template-columns:minmax(0,1.5fr) minmax(275px,.8fr)}.mapcard{border-radius:14px;min-height:520px}.listpanel,.card{border-radius:14px}.listpanel{min-height:520px}
.mapbadge{border-radius:9px}.maptools button{border-radius:9px}.marker{animation:none;filter:drop-shadow(0 3px 5px #0002)}.marker:nth-child(3n),.marker:nth-child(4n){animation:none}
.marker .face{width:43px;height:43px;outline-width:2px}.marker.current .face{width:49px;height:49px;outline-width:3px}.marker .bubble{font-weight:720}
.placepin{border-radius:9px;background:#fff;color:#4d4243;box-shadow:0 5px 12px #0002}.personrow{border-radius:11px}.personrow:hover,.personrow.current{background:#fcf3f4;border-color:#e9c7cc}.matchnum{background:#f9edef;color:#b44b5d}.matchnum.warm{background:#f5f3ee;color:#897761}
.filter{background:#fafafa;border-radius:8px}.demowarn{border-radius:9px}.usercard{border-radius:14px}.userhero{border-radius:11px 11px 0 0}
@media(max-width:1180px){.app{grid-template-columns:206px 1fr}.categories{grid-template-columns:repeat(3,minmax(0,1fr))}.cat{min-height:126px;height:126px}.mapgrid{grid-template-columns:1.35fr 1fr}}
@media(max-width:900px){.app{grid-template-columns:1fr}.main{padding:20px 17px 96px}.categories{grid-template-columns:repeat(3,minmax(0,1fr));display:grid;overflow:visible}.cat{min-width:0}.sidebar{display:none}.bottombar{background:#1c2025eF;border-color:#353b42}.bottombar button{color:#bdc0c5}.bottombar button.active{color:#fa8696}.banner{min-height:160px}}
@media(max-width:580px){.topbar h1{font-size:20px}.banner{padding:24px;align-items:flex-start}.banner h2{font-size:26px}.banner .btn{margin-top:2px}.discoverhead h2{font-size:21px}.discoverhead p{font-size:11px}.discovercount{display:none}.categories{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.cat{height:135px}.cat .catname{font-size:14px}.cat .catmeta{font-size:9px}.mapcard{min-height:400px}.mapgrid{grid-template-columns:1fr}.groupchip{padding:9px 12px}.circlebtn{width:37px;height:37px}.discoverhead{margin-bottom:13px}}
@media(prefers-reduced-motion:reduce){.cat,.catphoto,.btn,.marker{animation:none;transition:none}}
</style>

function avatarSVG(p){let hair=p.hair||'#40304b',skin=p.skin||'#efbda0',shirt=p.shirt||'#8e7cff',style=p.style||1,short=p.gender==='male',face=style%3;return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120"><defs><linearGradient id="b" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#f6e7ff"/><stop offset="1" stop-color="#fee4d8"/></linearGradient></defs><rect width="120" height="120" fill="url(#b)"/><circle cx="92" cy="18" r="20" fill="#fff" opacity=".42"/><path d="M11 120 Q14 82 58 82 Q105 81 111 120" fill="${shirt}"/><path d="M47 77h26v18q-13 13-26 0" fill="${skin}"/><path d="M27 53 Q21 19 60 13 Q102 12 95 60 L89 94 Q75 83 76 61 L45 65 Q43 88 25 96Z" fill="${hair}"/><ellipse cx="60" cy="55" rx="31" ry="37" fill="${skin}"/><path d="M28 48 Q24 18 53 18 Q89 9 94 43 Q77 36 69 27 Q60 43 28 48" fill="${hair}"/>${short?`<path d="M27 44 Q29 9 63 15 Q91 15 94 43 Q75 34 64 26 Q56 40 27 44" fill="${hair}"/>`:''}<ellipse cx="49" cy="57" rx="2.5" ry="3" fill="#3a2631"/><ellipse cx="72" cy="57" rx="2.5" ry="3" fill="#3a2631"/><path d="M53 74 Q60 ${face===0?81:77} 68 73" stroke="#ab666b" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M48 49h6M68 49h7" stroke="${hair}" stroke-width="2" stroke-linecap="round"/><circle cx="40" cy="67" r="5" fill="#ed8a85" opacity=".22"/><circle cx="80" cy="67" r="5" fill="#ed8a85" opacity=".22"/></svg>`}

function meetingsView(){return `<div class="single"><div class="viewhead"><button class="back" data-action="back">←</button><div><h2>Планы и встречи</h2><p>Можно договориться заранее: на сегодня, пятницу или любую дату.</p></div></div><div class="card"><div class="cardtitle"><strong>Мои планы</strong><button class="btn primary" data-action="new-meeting">➕ Создать встречу</button></div><div class="meetings">${S.meetings.length?S.meetings.slice().reverse().map(m=>`<div class="meeting"><div class="meeticon">${cat(m.cat).ico}</div><div style="flex:1"><b>${esc(m.label)} · ${esc(m.date)} в ${esc(m.time)}</b><p>📍 ${esc(m.place)} · ${fmt(m.budget)} ₽ · ${esc(m.desc||'Без описания')}</p></div><button title="Удалить" class="close" data-action="delete-meeting" data-id="${m.id}">×</button></div>`).join(''):'<div class="empty">Ты ещё не создал ни одной встречи.<br>Нажми «Создать встречу», чтобы добавить свою метку на карте в будущем.</div>'}</div></div><div class="card" style="margin-top:14px"><div class="cardtitle"><strong>🎈 Примеры встреч от пользователей</strong>${badgeDemo()}</div><div class="meetings">${meetingCards(3)}</div></div></div>`}
function communityView(){let posts=[{who:'Алина',text:'💨 Кто хочет в пятницу в кальянную на Окской? Люблю путешествия и хорошую музыку.',date:'Демо · сегодня'},{who:'Полина',text:'🎤 В караоке одной скучно! Ищу компанию, чтобы петь хиты 2000-х.',date:'Демо · сегодня'},{who:'Артём',text:'🎱 Готов сыграть в бильярд. Новички тоже приветствуются!',date:'Демо · вчера'},...S.posts];return `<div class="single"><div class="viewhead"><button class="back" data-action="back">←</button><div><h2>Лента, обсуждения, фотографии</h2><p>Здесь встречаются люди, даже если пока не определились с планами.</p></div></div><div class="card" style="margin-bottom:15px"><strong>✍️ Написать в сообщество</strong><form class="formin" id="postForm" style="margin-top:14px"><div class="field"><textarea name="message" maxlength="350" required placeholder="О чём хочется поговорить или куда сходить?"></textarea></div><button class="btn primary" type="submit">Опубликовать в демо-ленте</button></form></div><div class="timeline">${posts.slice().reverse().map(p=>`<div class="post"><b>💜 ${esc(p.who)}</b> <span class="pill">ДЕМО</span><p>${esc(p.text)}</p><span class="postmeta">${esc(p.date)} · 💬 Комментарии появятся в следующей версии</span></div>`).join('')}</div><div class="card" style="margin-top:14px"><b>📸 Фотогалерея встреч</b><p class="tinyNotice">В следующем этапе добавим загрузку фотографий с согласия участников и привязку снимков к заведениям.</p></div></div>`}
function profileView(){return `<div class="single"><div class="viewhead"><button class="back" data-action="back">←</button><div><h2>Мой профиль</h2><p>Измени интересы — и приложение подберёт новых собеседников.</p></div></div><div class="card"><div style="display:flex;gap:13px;align-items:center;margin-bottom:22px"><div class="avmini" style="width:64px;height:64px;border-radius:20px;font-size:32px">🙂</div><div><b>${esc(S.profile.name)}</b><p class="tinyNotice">Личный тестовый профиль · данные только на этом устройстве</p></div></div><form id="profileForm" class="formin"><div class="formgrid"><div class="field"><label>Имя</label><input maxlength="35" name="name" required value="${esc(S.profile.name)}"></div><div class="field"><label>Возраст (18+)</label><input type="number" name="age" min="18" max="100" required value="${S.profile.age}"></div><div class="field"><label>Пол</label><select name="gender">${opts([['male','Мужчина'],['female','Женщина'],['other','Другой / не указывать']],S.profile.gender)}</select></div><div class="field"><label>Район</label><select name="district">${opts([['Окская','Окская'],['Рязанский проспект','Рязанский проспект'],['Кузьминки','Кузьминки'],['Выхино','Выхино'],['Вешняки','Вешняки']],S.profile.district)}</select></div><div class="field"><label>Бюджет за встречу, ₽</label><input type="number" name="budget" min="0" max="1000000" value="${S.profile.budget}"></div><div class="field"><label>Крепость кальяна 1–5</label><select name="hookah">${[1,2,3,4,5].map(n=>`<option ${S.profile.hookah===n?'selected':''} value="${n}">${n} / 5</option>`).join('')}</select></div></div><div class="field"><label>Предпочтения по напиткам</label><select name="drink">${opts([['Не пью','Не пью'],['Коктейли','Коктейли'],['Вино','Вино'],['Пиво','Пиво'],['Крепкое','Крепкое'],['По настроению','По настроению']],S.profile.drink)}</select></div><div class="field"><label>Мои темы общения (выбери несколько)</label><div class="interestgrid" id="interestgrid">${TOPICS.map((t,i)=>`<button type="button" class="interest ${S.profile.topics.includes(i)?'chosen':''}" data-action="topic" data-id="${i}">${t}</button>`).join('')}</div></div><div class="demowarn">🔒 Для настоящего сервиса понадобятся подтверждение совершеннолетия, согласие на показ анкеты и настройки приватности геолокации.</div><button class="btn primary" type="submit">Сохранить профиль и пересчитать MATCH</button></form></div></div>`}
function businessView(){return `<div class="single"><div class="viewhead"><button class="back" data-action="back">←</button><div><h2>Кабинет заведения 🏪</h2><p>Пример будущей административной панели для баров, кальянных и игровых клубов.</p></div></div><div class="demowarn" style="margin-bottom:14px">Тестовый режим: здесь нет настоящей авторизации владельца и публикации в интернете. Акции сохраняются локально.</div><div class="bizdash" style="margin-bottom:15px"><div class="bizmetric"><strong>2</strong><small>Заведения на карте · демо</small></div><div class="bizmetric"><strong>${DEMOS.length}</strong><small>Анкеты вокруг · демо</small></div><div class="bizmetric"><strong>${S.offers.length}</strong><small>Ваши созданные акции</small></div></div><div class="card"><h3 style="margin-top:0">🎁 Добавить акцию</h3><form class="formin" id="offerForm"><div class="field"><label>Название заведения</label><input name="venue" required maxlength="70" placeholder="Например, Бар у Окской"></div><div class="field"><label>Предложение</label><input name="offer" required maxlength="120" placeholder="Скидка 15% по коду ВСТРЕЧА"></div><button type="submit" class="btn primary">Опубликовать в демо</button></form></div><div class="card" style="margin-top:15px"><strong>Тестовые акции</strong><div class="timeline" style="margin-top:12px">${[...PLACES.map(p=>({venue:p.title,offer:p.offer})),...S.offers].map(p=>`<div class="promo"><span class="pricon">🎁</span><div><b>${esc(p.venue)}</b><p>${esc(p.offer)}</p></div></div>`).join('')}</div></div></div>`}
function settingsView(){return `<div class="single"><div class="viewhead"><button class="back" data-action="back">←</button><div><h2>Настройки демоверсии</h2><p>Здесь можно подключить настоящий картографический слой Яндекса.</p></div></div><div class="card"><h3 style="margin-top:0">🗺️ Яндекс Карты</h3><p class="tinyNotice">Для интеграции интерактивных карт с персональными метками нужен API-ключ Яндекс JavaScript API. Без него приложение работает на встроенной схематичной карте Москвы. Ключ сохраняется только в этом браузере. Для реального сайта понадобится разрешённый домен.</p><form class="formin" id="mapForm"><div class="field"><label>API-ключ Яндекс Карт 2.1</label><input name="key" autocomplete="off" placeholder="Вставь API-ключ (можно оставить пустым)" value="${esc(S.apiKey)}"></div><div class="actionrow"><button class="btn primary" type="submit">Сохранить и подключить</button><button class="btn soft" type="button" data-action="demo-map">Оставить демо-карту</button></div></form><p class="tinyNotice">Как получить ключ: <a target="_blank" rel="noopener" href="https://yandex.ru/dev/jsapi-v2-1/doc/ru/">официальная инструкция Яндекса ↗</a></p></div><div class="card" style="margin-top:15px"><strong>🔔 Уведомления</strong><p class="tinyNotice">В реальной версии потребуется сервер для настоящих push-сообщений. Сейчас можно включить браузерные демонстрационные уведомления.</p><button class="btn soft" data-action="request-notifications">Разрешить тестовое уведомление</button></div><div class="card" style="margin-top:15px"><strong>🧹 Тестовые данные</strong><p class="tinyNotice">Очистить созданные встречи, сообщения и акции, а также вернуть исходный профиль.</p><button class="btn plain" data-action="reset">Сбросить локальное демо</button></div></div>`}
function modalHtml(){if(!S.modal)return '';let type=S.modal,person=DEMOS.find(x=>x.id===S.selected)||DEMOS[0];let header=type==='new'?'🎉 Создать встречу':type==='contact'?'💬 Как связаться?':type==='place'?'🏪 Карточка заведения':type==='invite'?'💌 Приглашение':'Уведомления';let sub=type==='new'?'Укажи, когда и где хочешь встретиться.':type==='contact'?`Профиль ${person.name} · демонстрация вариантов связи`:type==='place'?'Тестовое заведение на карте':type==='invite'?`Приглашение для ${person.name}`:'Локальные события демоверсии';let body='';if(type==='new'){let date=new Date(),day=`${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;body=`<form id="meetingForm" class="formin"><div class="field"><label>Чем займёмся?</label><select name="cat">${CAT.map(c=>`<option value="${c.id}" ${S.cat===c.id?'selected':''}>${c.ico} ${c.name}</option>`).join('')}</select></div><div class="formgrid"><div class="field"><label>Дата</label><input type="date" name="date" required min="${day}" value="${day}"></div><div class="field"><label>Время</label><input type="time" name="time" required value="20:00"></div><div class="field"><label>Район / заведение</label><input name="place" maxlength="100" required value="Окская"></div><div class="field"><label>Бюджет, ₽</label><input type="number" name="budget" min="0" max="1000000" required value="${S.profile.budget}"></div></div><div class="field"><label>Описание встречи</label><textarea name="desc" maxlength="250" placeholder="Ищу приятную компанию, хочется поболтать..."></textarea></div><button class="btn primary" type="submit">Добавить встречу</button></form>`}
if(type==='contact')body=`<p>Выбери способ связи. Пока здесь только визуальная проверка: номера и аккаунты тестовых персонажей не существуют.</p><div class="contactoptions">${[['🟢','WhatsApp'],['✈️','Telegram'],['📸','Instagram'],['📞','Позвонить']].map(([ic,x])=>`<button data-action="test-contact" data-service="${x}">${ic} ${x}<small>Демо · без отправки</small></button>`).join('')}</div><div class="demowarn" style="margin-top:15px">При запуске приложения показывать контактные данные можно будет только с согласия пользователя.</div>`;
if(type==='invite')body=`<p>Хочешь предложить <b>${esc(person.name)}</b> встретиться? В демо можно создать план, но отправка другому человеку пока не работает.</p><button class="btn primary" data-action="new-meeting">Создать приглашение</button>`;
if(type==='place'){let place=PLACES.find(p=>p.id===S.placeId)||PLACES[0];body=`<div class="promo"><div class="pricon">${place.icon}</div><div><strong>${esc(place.title)}</strong><p>${esc(place.offer)}</p></div></div><div class="tags"><span class="tag">📍 Москва · Рязанский район</span><span class="tag">🎁 Тестовый промокод</span></div><p class="tinyNotice">Это вымышленное заведение для тестирования. Не используйте карточку как реальный адрес.</p>`}
if(type==='notifications')body=`<div class="meeting"><div class="meeticon">❤️</div><div><b>Пять общих интересов!</b><p>Посмотри подходящие анкеты в разделе MATCH.</p></div></div><div class="meeting" style="margin-top:8px"><div class="meeticon">🎁</div><div><b>Скидка в заведении рядом</b><p>Это пример уведомления для тестирования.</p></div></div><button class="btn soft" data-action="request-notifications" style="margin-top:15px">Включить браузерные уведомления</button>`;
return `<div class="modalwrap" id="modalwrap"><div class="modal" role="dialog" aria-modal="true" aria-label="${esc(header)}"><div class="modalhead"><div><h2>${header}</h2><p>${esc(sub)}</p></div><button class="close" title="Закрыть" data-action="close">×</button></div><div class="modalbody">${body}</div></div></div>`}
function render(){let page=S.view==='home'?homeView():S.view==='person'?personView():S.view==='match'?matchView():S.view==='meetings'?meetingsView():S.view==='community'?communityView():S.view==='profile'?profileView():S.view==='business'?businessView():S.view==='settings'?settingsView():homeView();$('app').innerHTML=shell(page);if(S.view==='home'&&S.apiKey){setTimeout(initYandex,30)} if(S.view==='profile')S.interestDraft=[...S.profile.topics]}
function setModal(name){S.modal=name;render()}
function initYandex(){if(!S.apiKey||S.view!=='home')return;let d=$('yandex-map');if(!d)return;if(!window.ymaps){if(!window.__ymapsLoading){window.__ymapsLoading=true;let script=document.createElement('script');script.src='https://api-maps.yandex.ru/2.1/?apikey='+encodeURIComponent(S.apiKey)+'&lang=ru_RU';script.onerror=()=>{S.mapKind='demo';if($('map-demo'))$('map-demo').style.display='block';if($('yandex-map'))$('yandex-map').style.display='none';toast('Не удалось загрузить Яндекс Карты. Демонстрационная схема доступна.');};document.head.appendChild(script)}setTimeout(()=>{if(window.ymaps&&S.view==='home')initYandex();else if(S.view==='home'&&window.__ymapsLoading&&!window.ymaps){S.mapKind='demo';if($('map-demo'))$('map-demo').style.display='block';if($('yandex-map'))$('yandex-map').style.display='none';}},2200);return}try{window.ymaps.ready(()=>{if(S.view!=='home'||!$('yandex-map'))return;S.mapKind='yandex';$('map-demo').style.display='none';$('yandex-map').style.display='block';let m=new ymaps.Map('yandex-map',{center:[55.7178,37.791],zoom:14,controls:['zoomControl']});S.mapObj=m;filtered().forEach(p=>{let mark=new ymaps.Placemark(p.coords,{hintContent:`${p.name} · ${cat(p.cat).name}`,balloonContent:`<b>${esc(p.name)}, ${p.age}</b><p>${cat(p.cat).ico} ${cat(p.cat).name} · MATCH ${shared(p).length}</p><small>Тестовая анкета</small>`},{iconLayout:'default#image',iconImageHref:avatar(p),iconImageSize:[52,52],iconImageOffset:[-26,-26]});mark.events.add('click',()=>{S.selected=p.id;nav('person')});m.geoObjects.add(mark)});S.meetings.forEach((meeting,i)=>{let pt=new ymaps.Placemark([55.7178+(i%3)*.0008,37.789+(i%3)*.0012],{hintContent:`Моя встреча: ${meeting.label}`,balloonContent:`<b>${esc(meeting.label)}</b><p>${esc(meeting.date)} ${esc(meeting.time)}</p>`},{preset:'islands#yellowIcon'});pt.events.add('click',()=>nav('meetings'));m.geoObjects.add(pt)});PLACES.forEach(p=>{let mark=new ymaps.Placemark(p.coords,{hintContent:p.title,balloonContent:`<b>${esc(p.title)}</b><p>${esc(p.offer)} · тест</p>`},{preset:'islands#orangeIcon'});m.geoObjects.add(mark)});}).catch?.(()=>{S.mapKind='demo';toast('Ошибка загрузки Яндекс Карт')})}catch(e){S.mapKind='demo';toast('Яндекс Карты не инициализированы: проверьте API-ключ')}}
function browserNotify(){if(!('Notification' in window)){toast('Браузер не поддерживает уведомления.');return}Notification.requestPermission().then(p=>{if(p==='granted'){new Notification('С КЕМ ПОБУХАТЬ? ❤️',{body:'У тебя появился новый тестовый MATCH!'});toast('Тестовое уведомление отправлено.')}else toast('Разрешение не получено. Встроенные уведомления работают.')}).catch(()=>toast('Не удалось запросить разрешение.'))}
function locate(){if(!navigator.geolocation){toast('Геолокация недоступна в этом браузере.');return}toast('Запрашиваем разрешение на геолокацию…');navigator.geolocation.getCurrentPosition(pos=>{let la=pos.coords.latitude,lo=pos.coords.longitude;if(la>55.55&&la<55.9&&lo>37.4&&lo<38.2){if(S.mapObj)S.mapObj.setCenter([la,lo],15,{duration:300});toast('Геолокация получена. В демо точное местоположение не публикуется.')}else toast('Местоположение получено. Демоверсия пока показывает московский район Окской.')},()=>toast('Доступ к геолокации не предоставлен. Для файла он также может быть ограничен браузером.'),{enableHighAccuracy:false,timeout:10000,maximumAge:60000})}
function reset(){if(!window.confirm('Сбросить все созданные встречи, публикации, акции и настройки профиля?'))return;['skb_profile','skb_meetings','skb_posts','skb_offers','skb_yandex_key'].forEach(k=>localStorage.removeItem(k));location.reload()}
function actions(e){let t=e.target.closest('[data-action]');if(!t)return;let a=t.dataset.action;if(a==='nav')return nav(t.dataset.view);if(a==='home')return home();if(a==='back')return back();if(a==='category'){S.cat=t.dataset.cat;return render()}if(a==='cat-group'){S.categoryGroup=t.dataset.group;S.showAllCats=false;return render()}if(a==='all-categories'){S.showAllCats=!S.showAllCats;return render()}if(a==='person'){S.selected=+t.dataset.id;return nav('person')}if(a==='new-meeting')return setModal('new');if(a==='close'){S.modal='';return render()}if(a==='contact'){S.selected=+t.dataset.id;return setModal('contact')}if(a==='invite'){S.selected=+t.dataset.id;return setModal('invite')}if(a==='test-contact'){toast(`${t.dataset.service}: способ связи доступен в интерфейсе, но тестовый человек не существует.`);return}if(a==='place'){S.placeId=t.dataset.id;return setModal('place')}if(a==='notifications')return setModal('notifications');if(a==='request-notifications')return browserNotify();if(a==='locate')return locate();if(a==='demo-map'){S.apiKey='';S.mapKind='demo';localStorage.removeItem('skb_yandex_key');toast('Включена встроенная демо-карта.');return render()}if(a==='yandex'){if(!S.apiKey){toast('Для интерактивной Яндекс Карты укажите API-ключ в настройках.');return nav('settings')}return initYandex()}if(a==='zoom-in'||a==='zoom-out'){if(S.mapKind==='yandex'&&S.mapObj){S.mapObj.setZoom(S.mapObj.getZoom()+(a==='zoom-in'?1:-1));return}S.zoom=Math.max(.85,Math.min(1.6,S.zoom+(a==='zoom-in'?.13:-.13)));let svg=document.querySelector('.mapmain svg');if(svg)svg.style.transform=`scale(${S.zoom})`;toast('Масштаб демонстрационной схемы изменён.');return}if(a==='delete-meeting'){S.meetings=S.meetings.filter(m=>String(m.id)!==t.dataset.id);localStorage.setItem('skb_meetings',JSON.stringify(S.meetings));toast('Встреча удалена.');return render()}if(a==='topic'){let i=+t.dataset.id;if(S.interestDraft.includes(i))S.interestDraft=S.interestDraft.filter(n=>n!==i);else S.interestDraft.push(i);t.classList.toggle('chosen',S.interestDraft.includes(i));return}if(a==='reset')return reset()}
function submit(e){e.preventDefault();let f=e.target,fd=new FormData(f);if(f.id==='meetingForm'){let c=String(fd.get('cat')),label=cat(c).short,m={id:Date.now(),cat:c,label,date:String(fd.get('date')),time:String(fd.get('time')),place:String(fd.get('place')).trim(),budget:Math.max(0,Number(fd.get('budget'))||0),desc:String(fd.get('desc')).trim()};if(!m.place)return toast('Укажите место встречи.');S.meetings.push(m);localStorage.setItem('skb_meetings',JSON.stringify(S.meetings));S.modal='';nav('meetings');toast('Встреча создана! Она сохранена в этом браузере.');return}if(f.id==='profileForm'){let age=Number(fd.get('age'));if(age<18)return toast('Приложение предназначено для совершеннолетних.');S.profile={name:String(fd.get('name')).trim(),age,gender:String(fd.get('gender')),district:String(fd.get('district')),budget:Math.max(0,Number(fd.get('budget'))||0),hookah:Number(fd.get('hookah')),drink:String(fd.get('drink')),topics:[...S.interestDraft]};localStorage.setItem('skb_profile',JSON.stringify(S.profile));toast('Профиль сохранён. Совпадения пересчитаны.');return render()}if(f.id==='postForm'){let msg=String(fd.get('message')).trim();if(!msg)return;S.posts.push({who:S.profile.name,text:msg,date:'Моя демо-публикация'});localStorage.setItem('skb_posts',JSON.stringify(S.posts));toast('Запись опубликована в локальной демо-ленте.');return render()}if(f.id==='offerForm'){S.offers.push({venue:String(fd.get('venue')).trim(),offer:String(fd.get('offer')).trim()});localStorage.setItem('skb_offers',JSON.stringify(S.offers));toast('Акция добавлена в демо-кабинет.');return render()}if(f.id==='mapForm'){let key=String(fd.get('key')).trim();S.apiKey=key;S.mapKind=key?'yandex':'demo';localStorage.setItem('skb_yandex_key',JSON.stringify(key));nav('home');toast(key?'Пытаемся подключить Яндекс Карты…':'Используем встроенную карту.');return}}
document.addEventListener('click',actions);document.addEventListener('submit',submit);document.addEventListener('change',e=>{if(e.target.id==='genderFilter'){S.gender=e.target.value;render()}else if(e.target.id==='matchFilter'){S.topicsMin=+e.target.value;render()}});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.modal){S.modal='';render()}if((e.key==='Enter'||e.key===' ')&&e.target.matches('.usercard')){e.preventDefault();S.selected=+e.target.dataset.id;nav('person')}});document.addEventListener('click',e=>{if(e.target.id==='modalwrap'){S.modal='';render()}});
render();
})();
</script></body></html>
